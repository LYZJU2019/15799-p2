[package]
name = "optdbg"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "runner"
path = "src/runner.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.35", features = ["derive"] }
datafusion = "46.0.1"
optd-core = { path = "./optd/optd-core" }
chrono = "0.4.39"
optd-datafusion = { path = "./optd/optd-datafusion" }
optd_og-datafusion-bridge = { path = "./optd-original/optd_og-datafusion-bridge" }
optd_og-datafusion-repr = { path = "./optd-original/optd_og-datafusion-repr" }
optd_og-core = { path = "./optd-original/optd_og-core" }
tokio = { version = "1.44.2", features = ["full"] }
dolomite = { path = "./datafusion-dolomite/dolomite" }
datafusion-dolomite-integration = { path = "./datafusion-dolomite/datafusion-dolomite-integration/" }
async-recursion = "1.1.1"
async-trait = "0.1.88"
itertools = "0.14.0"
gag = "1.0.0"
datafusion-proto = "46.0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.19.1"
thiserror = "2.0.12"


